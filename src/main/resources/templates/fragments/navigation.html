<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-light bg-light">

                            <li><a class="dropdown-item" th:href="@{/orders}">注文入力</a></li>

                        </ul>
                    </li>

                        </ul>
                    </li>

                <!-- 現在時刻表示（モバイル時） -->
                <div class="d-lg-none text-muted small">
                    <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy/MM/dd HH:mm')}"></span>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
