<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>締め日設定</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6"><h2><i class="bi bi-calendar-range me-2"></i>締め日設定</h2></div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/billing-closing-dates/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> 新規登録</a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <h5>業者別締め日</h5>
                    <div class="card">
                        <div class="card-body">
                            <div th:if="${vendorClosingDates.empty}" class="alert alert-info">業者の締め日が登録されていません。</div>
                            <div th:unless="${vendorClosingDates.empty}">
                                <div th:each="date : ${vendorClosingDates}" class="p-3 border-bottom">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <strong th:text="${date.targetName}"></strong>
                                            <div class="small text-muted" th:text="${date.closingDay + '日'}"></div>
                                        </div>
                                        <div>
                                            <a th:href="@{/billing-closing-dates/{id}(id=${date.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/billing-closing-dates/{id}/edit(id=${date.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <h5>個人別締め日</h5>
                    <div class="card">
                        <div class="card-body">
                            <div th:if="${employeeClosingDates.empty}" class="alert alert-info">個人の締め日が登録されていません。</div>
                            <div th:unless="${employeeClosingDates.empty}">
                                <div th:each="date : ${employeeClosingDates}" class="p-3 border-bottom">
                                    <div class="d-flex justify-content-between">
                                        <div>
                                            <strong th:text="${date.targetName}"></strong>
                                            <div class="small text-muted" th:text="${date.closingDay + '日'}"></div>
                                        </div>
                                        <div>
                                            <a th:href="@{/billing-closing-dates/{id}(id=${date.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/billing-closing-dates/{id}/edit(id=${date.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
