<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メニュー新規登録</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <h2><i class="bi bi-plus-circle me-2"></i>メニュー新規登録</h2>
            <div class="row mt-4">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/menus}" th:object="${menuCreateRequest}" method="post">
                                <div class="mb-3">
                                    <label class="form-label form-required">業者</label>
                                    <select class="form-select" th:field="*{vendorId}">
                                        <option value="">-- 業者を選択 --</option>
                                        <option th:each="vendor : ${vendors}" th:value="${vendor.id}" th:text="${vendor.name}"></option>
                                    </select>
                                    <div class="field-error" th:if="${#fields.hasErrors('vendorId')}" th:errors="*{vendorId}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">メニュー名</label>
                                    <input type="text" class="form-control" th:field="*{name}">
                                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">価格</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{price}">
                                    <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">価格適用開始日</label>
                                    <input type="date" class="form-control" th:field="*{effectiveFrom}">
                                    <div class="field-error" th:if="${#fields.hasErrors('effectiveFrom')}" th:errors="*{effectiveFrom}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">説明</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary me-2"><i class="bi bi-check-circle"></i> 登録</button>
                                    <a th:href="@{/menus}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> キャンセル</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
