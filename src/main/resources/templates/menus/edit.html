<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メニュー編集</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <h2><i class="bi bi-pencil-square me-2"></i>メニュー編集</h2>
            <div class="row mt-4">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/menus/{id}(id=${menu.id})}" th:object="${menuUpdateRequest}" method="post">
                                <div class="mb-3">
                                    <label class="form-label text-muted">メニューID</label>
                                    <div class="form-control-plaintext" th:text="${menu.id}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted">業者</label>
                                    <div class="form-control-plaintext" th:text="${menu.vendor.name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">メニュー名</label>
                                    <input type="text" class="form-control" th:field="*{name}">
                                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">説明</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                                </div>
                                <div class="alert alert-info">
                                    <strong>注:</strong> 価格は「価格変更」ボタンから変更してください。
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary me-2"><i class="bi bi-check-circle"></i> 更新</button>
                                    <a th:href="@{/menus/{id}(id=${menu.id})}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> キャンセル</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
