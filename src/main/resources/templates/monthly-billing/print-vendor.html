<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>業者別月次集計印刷</title>
    <style th:inline="css">
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 20mm; }
        }
    </style>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="no-print mb-4">
                <button onclick="window.print()" class="btn btn-primary">
                    <i class="bi bi-printer"></i> 印刷
                </button>
                <a href="javascript:window.close()" class="btn btn-outline-secondary">
                    <i class="bi bi-x-circle"></i> 閉じる
                </a>
            </div>

            <div class="row">
                <div class="col-md-10">
                    <!-- ヘッダー -->
                    <div class="text-center mb-4">
                        <h2>業者別月次集計表</h2>
                    </div>

                    <!-- 業者情報 -->
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div><strong>業者名:</strong> <span th:text="${billing.vendor.name}"></span></div>
                                    <div><strong>連絡先:</strong> <span th:text="${billing.vendor.contactInfo ?: '未設定'}"></span></div>
                                </div>
                                <div class="col-md-6 text-end">
                                    <div><strong>期間:</strong> <span th:text="${yearMonth.year + '年' + yearMonth.monthValue + '月'}"></span></div>
                                    <div><strong>発行日:</strong> <span th:text="${#temporals.format(T(java.time.LocalDateTime).now(), 'yyyy/MM/dd')}"></span></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- メニュー別集計テーブル -->
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered">
                            <thead class="table-secondary">
                                <tr>
                                    <th>メニュー</th>
                                    <th class="text-center">数量</th>
                                    <th class="text-end">単価</th>
                                    <th class="text-end">小計</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${billing.menuDetails}">
                                    <td th:text="${detail.menuName}"></td>
                                    <td class="text-center fw-bold" th:text="${detail.quantity}"></td>
                                    <td class="text-end" th:text="${'¥' + #numbers.formatDecimal(detail.unitPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                                    <td class="text-end fw-bold" th:text="${'¥' + #numbers.formatDecimal(detail.subtotal, 0, 'COMMA', 0, 'POINT')}"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="table-secondary fw-bold">
                                    <td colspan="3" class="text-end">合計</td>
                                    <td class="text-end" th:text="${'¥' + #numbers.formatDecimal(billing.totalAmount, 0, 'COMMA', 0, 'POINT')}"></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <!-- サマリー -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <strong>合計注文数:</strong> <span th:text="${billing.totalOrders}"></span>件
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <strong>合計売上:</strong> <span class="text-primary fw-bold" th:text="${'¥' + #numbers.formatDecimal(billing.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/common.js}"></script>
    </th:block>
</body>
</html>
