<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員別月次集計</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <!-- ページヘッダー -->
            <div class="row mb-4">
                <div class="col-md-8">
                    <h2>
                        <i class="bi bi-person me-2"></i>社員別月次集計
                    </h2>
                </div>
                <div class="col-md-4 text-end">
                    <a th:href="@{/monthly-billing/employee/print(employeeId=${billing.employee.id}, year=${yearMonth.year}, month=${yearMonth.monthValue})}"
                       class="btn btn-outline-info" target="_blank">
                        <i class="bi bi-printer"></i> 印刷
                    </a>
                </div>
            </div>

            <!-- 社員情報 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div><strong>社員名:</strong> <span th:text="${billing.employee.name}"></span></div>
                            <div class="mt-1"><strong>部署:</strong> <span th:text="${billing.employee.department ?: '未設定'}"></span></div>
                            <div class="mt-1"><strong>社員番号:</strong> <span th:text="${billing.employee.employeeNumber}"></span></div>
                        </div>
                        <div class="col-md-6 text-end">
                            <h5 th:text="${yearMonth.year + '年' + yearMonth.monthValue + '月'}"></h5>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 月次ナビゲーション -->
            <div class="d-flex justify-content-center gap-2 mb-4">
                <a th:href="@{/monthly-billing/employee(employeeId=${billing.employee.id}, year=${previousMonth.year}, month=${previousMonth.monthValue})}" class="btn btn-outline-secondary">
                    <i class="bi bi-chevron-left"></i> 前月
                </a>
                <a th:href="@{/monthly-billing/employee(year=${yearMonth.year}, month=${yearMonth.monthValue})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 社員選択
                </a>
                <a th:href="@{/monthly-billing/employee(employeeId=${billing.employee.id}, year=${nextMonth.year}, month=${nextMonth.monthValue})}" class="btn btn-outline-secondary">
                    次月 <i class="bi bi-chevron-right"></i>
                </a>
            </div>

            <!-- 注文詳細テーブル -->
            <div class="card mb-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0">注文詳細</h5>
                </div>
                <div class="card-body">
                    <div th:if="${billing.orderDetails.empty}" class="alert alert-info">
                        この月に注文がありません。
                    </div>

                    <div th:unless="${billing.orderDetails.empty}" class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr class="table-secondary">
                                    <th>注文日</th>
                                    <th>メニュー</th>
                                    <th>業者</th>
                                    <th class="text-end">単価</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="detail : ${billing.orderDetails}">
                                    <td th:text="${#temporals.format(detail.orderDate, 'yyyy/MM/dd')}"></td>
                                    <td th:text="${detail.menuName}"></td>
                                    <td th:text="${detail.vendorName}"></td>
                                    <td class="text-end" th:text="${'¥' + #numbers.formatDecimal(detail.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- サマリー -->
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body text-center">
                            <h6 class="text-muted">合計注文数</h6>
                            <h3 th:text="${billing.totalOrders}"></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body text-center">
                            <h6 class="text-muted">合計金額</h6>
                            <h3 class="text-primary" th:text="${'¥' + #numbers.formatDecimal(billing.totalAmount, 0, 'COMMA', 0, 'POINT')}"></h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/common.js}"></script>
    </th:block>
</body>
</html>
