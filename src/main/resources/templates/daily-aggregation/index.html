<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>日次集計</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <!-- ページヘッダー -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <h2>
                        <i class="bi bi-graph-up me-2"></i>日次集計
                    </h2>
                </div>
                <div class="col-md-6 text-end">
                    <div class="btn-group" role="group">
                        <a th:href="@{/daily-aggregation/print(date=${targetDate})}" class="btn btn-outline-info" target="_blank">
                            <i class="bi bi-printer"></i> 全業者を印刷
                        </a>
                        <a th:href="@{/daily-aggregation/select-vendor(date=${targetDate})}" class="btn btn-outline-info">
                            <i class="bi bi-file-earmark-pdf"></i> 業者別印刷
                        </a>
                    </div>
                </div>
            </div>

            <!-- 日付ナビゲーション -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/daily-aggregation(date=${previousDate})}" class="btn btn-outline-secondary">
                    <i class="bi bi-chevron-left"></i> 前日
                </a>
                <h3 class="mb-0">
                    <span th:text="${#temporals.format(targetDate, 'yyyy年MM月dd日（EEEE）')}"></span>
                </h3>
                <a th:href="@{/daily-aggregation(date=${nextDate})}" class="btn btn-outline-secondary">
                    次日 <i class="bi bi-chevron-right"></i>
                </a>
            </div>

            <!-- 集計サマリー -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="card-title text-muted">対象業者数</h6>
                            <h3 class="card-text" th:text="${aggregation.vendorAggregations.size()}"></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="card-title text-muted">合計注文数</h6>
                            <h3 class="card-text" th:text="${aggregation.totalOrderCount}"></h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="card-title text-muted">合計売上</h6>
                            <h3 class="card-text text-primary">
                                <span th:text="${'¥' + #numbers.formatDecimal(aggregation.totalRevenue, 0, 'COMMA', 0, 'POINT')}"></span>
                            </h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center">
                        <div class="card-body">
                            <h6 class="card-title text-muted">対象メニュー数</h6>
                            <h3 class="card-text" th:text="${aggregation.uniqueMenuCount}"></h3>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 業者別集計 -->
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">
                        <i class="bi bi-building"></i> 業者別集計
                    </h5>
                </div>
                <div class="card-body">
                    <div th:if="${aggregation.vendorAggregations.empty}" class="alert alert-info">
                        この日の注文がありません。
                    </div>

                    <div th:unless="${aggregation.vendorAggregations.empty}">
                        <div class="accordion" id="vendorAccordion">
                            <div class="accordion-item" th:each="vendorAgg : ${aggregation.vendorAggregations}">
                                <h2 class="accordion-header">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                            th:data-bs-target="'#vendor_' + ${vendorAgg.vendor.id}"
                                            th:aria-controls="'vendor_' + ${vendorAgg.vendor.id}">
                                        <strong th:text="${vendorAgg.vendor.name}"></strong>
                                        <span class="badge bg-info ms-3" th:text="${vendorAgg.totalOrderCount + '件'}"></span>
                                        <span class="badge bg-success ms-2" th:text="${'¥' + #numbers.formatDecimal(vendorAgg.totalRevenue, 0, 'COMMA', 0, 'POINT')}"></span>
                                    </button>
                                </h2>
                                <div th:id="'vendor_' + ${vendorAgg.vendor.id}" class="accordion-collapse collapse" data-bs-parent="#vendorAccordion">
                                    <div class="accordion-body">
                                        <div class="table-responsive">
                                            <table class="table table-sm table-hover">
                                                <thead>
                                                    <tr>
                                                        <th>メニュー</th>
                                                        <th>単価</th>
                                                        <th class="text-center">数量</th>
                                                        <th class="text-right">小計</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr th:each="menuAgg : ${vendorAgg.menuAggregations}">
                                                        <td th:text="${menuAgg.menuName}"></td>
                                                        <td class="text-end" th:text="${'¥' + #numbers.formatDecimal(menuAgg.unitPrice, 0, 'COMMA', 0, 'POINT')}"></td>
                                                        <td class="text-center fw-bold" th:text="${menuAgg.quantity}"></td>
                                                        <td class="text-end fw-bold text-primary" th:text="${'¥' + #numbers.formatDecimal(menuAgg.subtotal, 0, 'COMMA', 0, 'POINT')}"></td>
                                                    </tr>
                                                </tbody>
                                                <tfoot>
                                                    <tr class="table-secondary">
                                                        <td colspan="3" class="text-end"><strong>合計</strong></td>
                                                        <td class="text-end fw-bold text-primary" th:text="${'¥' + #numbers.formatDecimal(vendorAgg.totalRevenue, 0, 'COMMA', 0, 'POINT')}"></td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                        <div class="text-end mt-3">
                                            <a th:href="@{/daily-aggregation/print(date=${targetDate}, vendorId=${vendorAgg.vendor.id})}"
                                               class="btn btn-sm btn-outline-info" target="_blank">
                                                <i class="bi bi-printer"></i> この業者を印刷
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 注意事項 -->
            <div class="alert alert-info mt-4">
                <i class="bi bi-info-circle"></i>
                <strong>注意:</strong> この集計は毎日朝8:45に自動で完成します。
                8:30までに入力された注文のみが対象です。
            </div>
        </div>
    </main>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/common.js}"></script>
    </th:block>
</body>
</html>
