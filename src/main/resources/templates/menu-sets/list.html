<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メニューセット一覧</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6">
                    <h2><i class="bi bi-list-ul me-2"></i>メニューセット一覧</h2>
                </div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/menu-sets/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> 新規登録</a>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <form th:action="@{/menu-sets}" method="get" class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="セット名で検索" th:value="${searchName}">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> 検索</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div th:if="${menuSets.empty}" class="alert alert-info">メニューセットが登録されていません。</div>
                    <div th:unless="${menuSets.empty}" class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr class="table-secondary">
                                    <th>ID</th>
                                    <th>セット名</th>
                                    <th>含まれるメニュー数</th>
                                    <th>説明</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="menuSet : ${menuSets}">
                                    <td th:text="${menuSet.id}"></td>
                                    <td><a th:href="@{/menu-sets/{id}(id=${menuSet.id})}" th:text="${menuSet.name}"></a></td>
                                    <td class="text-center" th:text="${menuSet.menus.size()}"></td>
                                    <td th:text="${menuSet.description ?: '-'}"></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/menu-sets/{id}(id=${menuSet.id})}" class="btn btn-outline-primary"><i class="bi bi-eye"></i></a>
                                            <a th:href="@{/menu-sets/{id}/edit(id=${menuSet.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
