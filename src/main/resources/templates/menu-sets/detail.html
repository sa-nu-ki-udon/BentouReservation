<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>メニューセット詳細</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6"><h2><i class="bi bi-list-ul me-2"></i>メニューセット詳細</h2></div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/menu-sets/{id}/edit(id=${menuSet.id})}" class="btn btn-primary me-2"><i class="bi bi-pencil"></i> 編集</a>
                    <a th:href="@{/menu-sets}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 一覧に戻る</a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3"><label class="form-label text-muted">セットID</label><div th:text="${menuSet.id}"></div></div>
                            <div class="mb-3"><label class="form-label text-muted">セット名</label><div class="fw-bold" th:text="${menuSet.name}"></div></div>
                            <div class="mb-3"><label class="form-label text-muted">説明</label><div th:if="${menuSet.description}" th:text="${menuSet.description}"></div><div th:unless="${menuSet.description}" class="text-muted">未設定</div></div>
                            <hr>
                            <h6>含まれるメニュー一覧</h6>
                            <div th:if="${menuSet.menus.empty}" class="alert alert-info">メニューが登録されていません。</div>
                            <div th:unless="${menuSet.menus.empty}" class="table-responsive">
                                <table class="table table-sm">
                                    <thead><tr class="table-secondary"><th>メニュー</th><th>業者</th><th class="text-end">価格</th></tr></thead>
                                    <tbody><tr th:each="item : ${menuSet.menus}">
                                        <td th:text="${item.menu.name}"></td>
                                        <td th:text="${item.menu.vendor.name}"></td>
                                        <td class="text-end" th:text="${'¥' + #numbers.formatDecimal(item.menu.price, 0, 'COMMA', 0, 'POINT')}"></td>
                                    </tr></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light"><h5 class="mb-0">操作</h5></div>
                        <div class="card-body d-grid gap-2">
                            <a th:href="@{/menu-sets/{id}/edit(id=${menuSet.id})}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i> 編集</a>
                            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"><i class="bi bi-trash"></i> 削除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white"><h5 class="modal-title">確認</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">このメニューセットを削除してもよろしいですか？</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <form th:action="@{/menu-sets/{id}/delete(id=${menuSet.id})}" method="post" style="display:inline;"><button type="submit" class="btn btn-danger">削除</button></form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
