<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員選択</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-12">
                    <h2>
                        <i class="bi bi-person-check me-2"></i>注文する社員を選択してください
                    </h2>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="list-group">
                                <a th:each="employee : ${employees}"
                                   th:href="@{/orders(employeeId=${employee.id})}"
                                   class="list-group-item list-group-item-action">
                                    <div class="d-flex w-100 justify-content-between">
                                        <h5 class="mb-1" th:text="${employee.name}"></h5>
                                        <small th:text="${employee.department ?: '部署未設定'}"></small>
                                    </div>
                                    <p class="mb-1 text-muted">
                                        社員番号: <span th:text="${employee.employeeNumber}"></span>
                                    </p>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
