<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員新規登録</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <h2><i class="bi bi-plus-circle me-2"></i>社員新規登録</h2>
            <div class="row mt-4">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/employees}" th:object="${employeeCreateRequest}" method="post">
                                <div class="mb-3">
                                    <label class="form-label form-required">社員番号</label>
                                    <input type="text" class="form-control" th:field="*{employeeNumber}">
                                    <div class="field-error" th:if="${#fields.hasErrors('employeeNumber')}" th:errors="*{employeeNumber}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">氏名</label>
                                    <input type="text" class="form-control" th:field="*{name}">
                                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">部署</label>
                                    <input type="text" class="form-control" th:field="*{department}" placeholder="例: 営業部">
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary me-2"><i class="bi bi-check-circle"></i> 登録</button>
                                    <a th:href="@{/employees}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> キャンセル</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
