<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員一覧</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6"><h2><i class="bi bi-people me-2"></i>社員一覧</h2></div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/employees/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> 新規登録</a>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <form th:action="@{/employees}" method="get" class="input-group">
                        <input type="text" name="name" class="form-control" placeholder="社員名で検索" th:value="${searchName}">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> 検索</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <form th:action="@{/employees}" method="get" class="input-group">
                        <input type="text" name="department" class="form-control" placeholder="部署で検索" th:value="${searchDepartment}">
                        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> 検索</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div th:if="${employees.empty}" class="alert alert-info">社員が登録されていません。</div>
                    <div th:unless="${employees.empty}" class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr class="table-secondary">
                                    <th>ID</th>
                                    <th>社員番号</th>
                                    <th>名前</th>
                                    <th>部署</th>
                                    <th>登録日</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="employee : ${employees}">
                                    <td th:text="${employee.id}"></td>
                                    <td th:text="${employee.employeeNumber}"></td>
                                    <td><a th:href="@{/employees/{id}(id=${employee.id})}" th:text="${employee.name}"></a></td>
                                    <td th:text="${employee.department ?: '-'}"></td>
                                    <td th:text="${#temporals.format(employee.createdAt, 'yyyy/MM/dd')}"></td>
                                    <td><div class="btn-group btn-group-sm">
                                        <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn btn-outline-primary"><i class="bi bi-eye"></i></a>
                                        <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                    </div></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
