<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員詳細</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-6"><h2><i class="bi bi-person me-2"></i>社員詳細</h2></div>
                <div class="col-md-6 text-end">
                    <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-primary me-2"><i class="bi bi-pencil"></i> 編集</a>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 一覧に戻る</a>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3"><label class="form-label text-muted">社員ID</label><div th:text="${employee.id}"></div></div>
                            <div class="mb-3"><label class="form-label text-muted">社員番号</label><div class="fw-bold" th:text="${employee.employeeNumber}"></div></div>
                            <div class="mb-3"><label class="form-label text-muted">氏名</label><div class="fw-bold" th:text="${employee.name}"></div></div>
                            <div class="mb-3"><label class="form-label text-muted">部署</label><div th:if="${employee.department}" th:text="${employee.department}"></div><div th:unless="${employee.department}" class="text-muted">未設定</div></div>
                            <hr>
                            <div class="row"><div class="col-md-6"><label class="form-label text-muted">登録日時</label><div th:text="${#temporals.format(employee.createdAt, 'yyyy/MM/dd HH:mm')}"></div></div>
                            <div class="col-md-6"><label class="form-label text-muted">更新日時</label><div th:text="${#temporals.format(employee.updatedAt, 'yyyy/MM/dd HH:mm')}"></div></div></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header bg-light"><h5 class="mb-0">操作</h5></div>
                        <div class="card-body d-grid gap-2">
                            <a th:href="@{/employees/{id}/edit(id=${employee.id})}" class="btn btn-outline-primary"><i class="bi bi-pencil"></i> 編集</a>
                            <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal"><i class="bi bi-trash"></i> 削除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="deleteModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white"><h5 class="modal-title">確認</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">この社員を削除してもよろしいですか？</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <form th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post" style="display:inline;"><button type="submit" class="btn btn-danger">削除</button></form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
