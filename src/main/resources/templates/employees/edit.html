<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>社員編集</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="container">
            <h2><i class="bi bi-pencil-square me-2"></i>社員編集</h2>
            <div class="row mt-4">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/employees/{id}(id=${employee.id})}" th:object="${employeeUpdateRequest}" method="post">
                                <div class="mb-3">
                                    <label class="form-label text-muted">社員番号</label>
                                    <div class="form-control-plaintext" th:text="${employee.employeeNumber}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label form-required">氏名</label>
                                    <input type="text" class="form-control" th:field="*{name}">
                                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">部署</label>
                                    <input type="text" class="form-control" th:field="*{department}">
                                </div>
                                <div class="mb-3">
                                    <button type="submit" class="btn btn-primary me-2"><i class="bi bi-check-circle"></i> 更新</button>
                                    <a th:href="@{/employees/{id}(id=${employee.id})}" class="btn btn-outline-secondary"><i class="bi bi-x-circle"></i> キャンセル</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
